[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgilit"
version = "0.1.0"
description = "AI-assisted literature prioritization and drug-gene interaction curation for DGIdb"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Matthew Cannon" }
]
dependencies = [
  "polars",
  "pydantic",
  "tqdm",
  "wags-llm",
]

[project.optional-dependencies]
pmc = [
  "transformers",
  "torch",
  "requests",
  "inflect",
  "huggingface-hub",
]
qwen = [
  "mlx>=0.32.2,<0.33",
  "mlx-lm>=0.32.2,<0.33",
]
transformers = [
  "transformers",
]

[project.scripts]
dgilit-pmc = "dgilit.pmc_cli:main"

[tool.setuptools.package-data]
dgilit = ["dgilit_prompts/*.text"]

[tool.setuptools.packages.find]
where = ["src"]
